name: Rebuild search data
on:
  schedule: [{cron: "0 5 * * *"}]   # every day at 05:00 UTC
  workflow_dispatch:                # also a manual "Run workflow" button
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas sentence-transformers
      - run: python build.py
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/entries.json
          git diff --staged --quiet || (git commit -m "Update entries" && git push)
